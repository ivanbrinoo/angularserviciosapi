<form #formulario="ngForm">
  ID: <input type="number" name="cajaid" #cajaid />
  <button (click)="buscarCoche()">Buscar</button>
</form>


@for(coche of arraycoches; track coche) {
    <div class="card" style="width: 18rem;">
  <div class="card-header">
    {{coche.marca}} {{coche.modelo}}
  </div>
  <ul class="list-group list-group-flush">
    <li class="list-group-item">{{coche.idCoche}}</li>
    <li class="list-group-item">{{coche.conductor}}</li>
    <li class="list-group-item"><img src="{{coche.imagen}}" style="width: 200px;"></li>

  </ul>
</div>
}
