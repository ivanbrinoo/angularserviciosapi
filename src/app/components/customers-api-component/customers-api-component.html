<h1>Funciona?</h1>
@for(customer of arraycustomers; track customer){
    <div class="card" style="width: 18rem;">
<div class="card-header">
    {{customer.CustomerID}}
  </div>
  <ul class="list-group list-group-flush">
    <li class="list-group-item">Compañia: {{customer.CompanyName}}</li>
    <li class="list-group-item">Pais: {{customer.Country}}</li>
    <li class="list-group-item">Contact: {{customer.ContactTitle}}</li>
  </ul>
</div>
}
